services:
  mc:
    tty: true
    stdin_open: true
    image: itzg/minecraft-server
    environment:
      EULA: true
      MODPACK_PLATFORM: AUTO_CURSEFORGE
      SEED: "271983547940499847"
      VIEW_DISTANCE: 32
      CF_API_KEY: ${CF_API_KEY}
      CF_MODPACK_MANIFEST: /modpack/manifest.json
      CF_SLUG: "custom"
      VERSION: "1.20.1"
      MOTD: "&eGracias SergioElLitri!"
      SNOOPER_ENABLED: false
      ONLINE_MODE: true
      ICON: /server-icon.png
    volumes:
      - ./server-icon.png:/server-icon.png:ro
      - ./modpack:/modpack:ro
      - ./data:/data
    ports:
      - "25565:25565"
